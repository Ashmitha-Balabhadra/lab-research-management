# Server Configuration
# PORT env var is injected by Render automatically; default to 8081 for local dev
server.port=${PORT:8081}

# Spring DataSource (PostgreSQL - Render hosted)
# Render DB: lab-resource-db | Region: Singapore | PostgreSQL 16
# Dashboard: https://dashboard.render.com/d/dpg-da2ukm2jnfac73e9vupg-a
#
# For Render deployment: set DATABASE_URL env var (auto-linked from render.yaml)
# DatabaseConfig.java converts postgres:// URI -> jdbc:postgresql:// automatically
#
# For local dev: override with your local PG or set DB_URL/DB_USERNAME/DB_PASSWORD
# External JDBC URL (set this as DB_URL for connecting from outside Render):
#   jdbc:postgresql://dpg-da2ukm2jnfac73e9vupg-a.singapore-postgres.render.com:5432/lab_resource_utilization?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lab_resource_utilization}
spring.datasource.username=${DB_USERNAME:lab_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# App JWT Properties
# On Render: set JWT_SECRET as environment variable (use a long random string)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
# On Render: set CORS_ORIGINS to your deployed frontend URL (e.g. https://your-app.onrender.com)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

# Cloudinary Configuration
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Spring Mail
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
