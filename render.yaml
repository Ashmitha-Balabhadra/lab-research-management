services:
  # ─── Backend (Spring Boot) ─────────────────────────────────────────────────
  - type: web
    name: lab-resource-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: PORT
        value: 8080

      # PostgreSQL — injected from the linked database (see databases block below)
      - key: DB_URL
        fromDatabase:
          name: lab-resource-db
          property: connectionString

      - key: DB_USERNAME
        fromDatabase:
          name: lab-resource-db
          property: user

      - key: DB_PASSWORD
        fromDatabase:
          name: lab-resource-db
          property: password

      # JWT — set in Render dashboard → Environment → Secret Files / Env Vars
      - key: JWT_SECRET
        sync: false          # set manually in Render dashboard

      - key: JWT_EXPIRATION_MS
        value: 86400000

      # CORS — update to your actual frontend URL after deploying frontend
      - key: CORS_ORIGINS
        sync: false          # set manually: e.g. https://lab-resource-frontend.onrender.com

      # Cloudinary — set in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Mail — set in Render dashboard (optional)
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"

  # ─── Frontend (React / Vite) ───────────────────────────────────────────────
  - type: web
    name: lab-resource-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          name: lab-resource-backend
          type: web
          property: host
          envVarKey: VITE_API_BASE_URL

# ─── PostgreSQL Database ───────────────────────────────────────────────────
databases:
  - name: lab-resource-db
    plan: free
    databaseName: lab_resource_utilization
